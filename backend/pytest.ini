[pytest]
# `python -m pytest` prepends the working directory to sys.path; a bare
# `pytest` does not. Local runs used the former and CI the latter, so the
# suite passed here and failed there with `No module named 'app'` -- the
# first thing CI caught when it ran for the first time. Pinning the path
# here makes both invocations resolve `app` identically.
pythonpath = .
testpaths = app/tests
