[pytest]
# `python -m pytest` prepends the working directory to sys.path; a bare
# `pytest` does not. Local runs used the former and CI the latter, so the
# suite passed here and failed there with `No module named 'app'` -- the
# first thing CI caught when it ran for the first time. Pinning the path
# here makes both invocations resolve `app` identically.
pythonpath = .
testpaths = app/tests

# Third-party deprecations we do not control, silenced so a real warning from
# our own code is visible instead of buried. Each names the dependency that
# emits it, so the entry can be removed when that dependency is upgraded.
filterwarnings =
    default
    # starlette's TestClient on httpx 0.x -- gone when it moves to httpx2
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    # passlib reaching for the stdlib `crypt` module, removed in 3.13
    ignore:'crypt' is deprecated:DeprecationWarning
    # reportlab's rl_safe_eval probing ast.NameConstant
    ignore:ast.NameConstant is deprecated:DeprecationWarning
