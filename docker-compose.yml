# ---------------------------------------------------------------------------
# DEVELOPMENT compose file.
#
# This file deliberately bind-mounts host source into the containers so edits
# are picked up without a rebuild. That means the running code is the host's,
# NOT the image's -- correct for development, and the reason this file cannot
# serve as a production reference. For production, see docker-compose.prod.yml.
#
# No `name:` here on purpose. Compose defaults the project name to this
# directory (`singnerpro`), which is what the long-running dev containers and
# the `singnerpro_postgres-data` volume were created under. Setting a name
# would silently re-point the stack at a different, empty volume.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signflow
      POSTGRES_USER: signflow
      POSTGRES_PASSWORD: signflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signflow -d signflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web SQL client for the dev database, on http://localhost:8080. Pre-filled
  # with the `postgres` service; log in as signflow/signflow, database
  # signflow. Development only -- it is absent from docker-compose.prod.yml on
  # purpose, where the database is not published to the host at all.
  adminer:
    image: adminer:6.0.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Catches every email the app sends, locally, instead of delivering it.
  # Signing invitations, reminders, OTPs and notifications all land in the web
  # UI on http://localhost:8025 -- which is also the only way to get a signing
  # link out of a dev stack, since the raw token is hashed and never stored.
  #
  # Unauthenticated on purpose: `core/email.py` only calls `starttls()`/`login()`
  # when SMTP_USERNAME *and* SMTP_PASSWORD are both set, so leaving them unset
  # below keeps the plain-SMTP path Mailpit expects.
  #
  # `:latest` diverges from this file's habit of pinning (see adminer). Pin it
  # to a released tag if a Mailpit change ever surprises you.
  mailcatcher:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Object storage for development, S3-compatible. The app talks to it exactly
  # as it will talk to S3 in production -- same code path, same presigned URLs
  # -- so switching over is a matter of environment, not of a second backend
  # nobody has exercised. Console on http://localhost:9003 (minioadmin).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Published because presigned URLs are opened by the browser, not by the
      # API: they must point at a host the browser can resolve. Host ports are
      # 9002/9003 rather than the usual 9000/9001, which another local stack
      # already holds; override with MINIO_PORT / MINIO_CONSOLE_PORT.
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket, then exits. `up` reports it as exited (0),
  # which is the intended end state, not a failure.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-signforge} &&
      echo 'bucket ready: ${S3_BUCKET:-signforge}'
      "

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://signflow:signflow@postgres:5432/signflow
      JWT_SECRET: change-this-secret
      JWT_EXPIRES_MINUTES: 15
      APP_BASE_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      SIGNING_TOKEN_EXPIRE_DAYS: 14
      # Development runs on MinIO so the S3 code path is the one under test.
      # Production points these at real S3 (or keeps STORAGE_BACKEND=local for
      # a single-node deployment); nothing in the app changes.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${S3_BUCKET:-signforge}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://minio:9000
      # Presigned URLs are opened by the browser, which cannot resolve `minio`.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:${MINIO_PORT:-9002}}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # MinIO rejects SSE-S3 unless it is configured with a KMS; AWS is where
      # AES256 belongs.
      S3_SERVER_SIDE_ENCRYPTION: ""
      ENVIRONMENT: development
      # Billing / signer-payment Stripe config. NOT passed through here at all
      # previously -- devs exercising Stripe locally had to run the backend
      # outside compose (against backend/.env) or add these lines themselves.
      # Left as ${VAR:-} so the stack still comes up with BILLING_PROVIDER=null
      # when unset; the signer-payment endpoints 409 until these are set.
      BILLING_PROVIDER: ${BILLING_PROVIDER:-null}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-dev-billing-webhook-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Separate secret from STRIPE_WEBHOOK_SECRET above -- see
      # backend/.env.example for why crossing the two is the likeliest
      # misconfiguration.
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # The entrypoint runs `alembic upgrade head` under an advisory lock before
      # starting, so a fresh `docker compose up` gets a migrated database.
      RUN_MIGRATIONS: "1"
      # Local mail capture (the `mailcatcher` service above). Username and
      # password are deliberately absent: `core/email.py` only negotiates
      # STARTTLS and logs in when both are present, and Mailpit wants neither.
      #
      # RESEND_API_KEY is deliberately NOT passed through. `core/email.py`
      # prefers Resend over SMTP whenever it is set, so forwarding a dev's
      # exported key would send real mail to real people from a dev stack
      # while this service sat empty.
      SMTP_HOST: ${SMTP_HOST:-mailcatcher}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@signflow.local}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - signflow-uploads:/app/uploads
    # Dev override: a single auto-reloading uvicorn instead of the image's
    # gunicorn worker pool, so bind-mounted edits take effect immediately.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Only `service_started`: a missing mail server is caught and logged by
      # `core/email.py` rather than failing a request, so this is about the
      # first invitation not vanishing, not about correctness.
      mailcatcher:
        condition: service_started
    # Readiness, not liveness: this exists so `frontend` waits for a backend
    # that has actually finished migrating, rather than racing it and serving
    # 500s for the first half-minute of every `up`. /api/health/ready checks the
    # database, storage, and that alembic_version matches this build's head.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      # Stop at the deps stage: we want node_modules (including devDependencies)
      # but the source comes from the bind mount below, not from the image.
      target: deps
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
      # Origins allowed to frame /sign/*. Unlike the production image -- where
      # this must be a build arg, because `next build` bakes headers() into
      # routes-manifest.json -- `next dev` re-evaluates next.config.ts on each
      # request, so setting it here does work in development. Empty means
      # frame-ancestors 'none'.
      EMBED_FRAME_ANCESTORS: ${EMBED_FRAME_ANCESTORS:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  signflow-uploads:
  minio-data:
