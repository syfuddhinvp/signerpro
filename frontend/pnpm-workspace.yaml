# Security-critical dependency overrides.
#
# postcss: Next vendors its OWN nested copy under node_modules/next/node_modules,
# which the direct devDependency does not reach. Without this override that copy
# stays on 8.4.31, carrying GHSA-fxqj-rqcc-2cmp (arbitrary .map file read via an
# attacker-controlled sourceMappingURL) plus 3 more. npm's only offered fix was
# next@16 (breaking), so pinning every copy here is what keeps the audit clean.
# Verify after any dependency change with:
#   find node_modules/.pnpm -maxdepth 1 -name 'postcss@*'
# form-data:   GHSA-hmw2-7cc7-3qxx (CRLF injection)
# @babel/core: GHSA-4x5r-pxfx-6jf8 (arbitrary file read)
#
# NOTE: these live here, not in package.json's `pnpm` field -- pnpm 11 stopped
# reading that field and ignores it *with only a warning*, which silently
# reintroduced all four advisories when this project moved from npm to pnpm.
overrides:
  postcss: ^8.5.26
  form-data: ^4.0.6
  '@babel/core': ^7.29.1

# pnpm >=10 does not run dependency build scripts unless they are approved here.
allowBuilds:
  # Native/binary postinstalls we genuinely need.
  esbuild: true   # vite/vitest toolchain
  sharp: true     # next/image optimisation
  canvas: true    # pdfjs-dist optional native backend
  # msw's postinstall only copies mockServiceWorker.js into public/ for
  # *browser* mocking. The suite uses msw/node under jsdom, so it is not
  # needed and would otherwise write an unused asset into public/.
  msw: false

# Pinned by pnpm's minimum-release-age policy at install time; both are
# current releases already in use by the test suite.
minimumReleaseAgeExclude:
  - '@testing-library/react@16.3.3'
  - '@vitejs/plugin-react@6.1.1'
